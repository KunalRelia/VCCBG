version: "v0.4"

project:
  name: "Formalization of the VCCBG paper"
  description: >-
    This repository contains the formal verification in Lean of 
    results from the paper on the computational complexity of the 
    Vertex Cover Problem on Cubic Bridgeless Graphs (VCCBG). 
    Specifically, this repository formalizes: 
    1. an unconditional deterministic polynomial-time exact 
    algorithm for VCCBG (Theorem 2, Part II).
    2. the proof of NP-completeness of VCCBG (Theorem 1, Section B). 
    3. the proof of correctness of an alternative unconditional 
    deterministic polynomial-time exact algorithm for 
    VCCBG (Theorem 13, Section C). 
    The core contribution of the paper are the algorithms. 
    For each one [Part II; Section C], the formalization strictly follows 
    the paper's structure and formalizes: 
    1. a novel data structure [represents table; n/a] and 
    2. a novel concept ([diminishing hops; diminishing bipartite graphs] analogous 
    to augmenting paths used for maximum matching), 
    3. a novel graph-theory result (bridging [diminishing hops; diminishing 
    bipartite graphs] and minimum vertex cover analogous to Berge's Theorem), 
    4. discovers an algorithm that uses [diminishing hops; diminishing
    bipartite graphs] to find a minimum vertex cover (analogous to the Blossom
    Algorithm using augmenting paths to find a maximum matching due to Berge Theorem).
  authors:
    - Kunal Relia
  license: "Apache-2.0"
  responsible_maintainers:
    - Kunal Relia

classification:
  arxiv: [cs.CC, cs.DS]
  msc2020: ["68Q15", "68P05", "68W40", "05C70"]

